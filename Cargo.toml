[package]
name = "autosel"
version = "0.1.0"
edition = "2024"
authors = ["Sasha Levin <sashal@kernel.org>"]
license = "GPL-2.0"
description = "CLI tool for automatically classifying whether Linux kernel commits should be backported to stable trees"

[features]
default = []
cuda = ["commit-classifier/cuda"]

[dependencies]
commit-classifier = { git = "https://git.sr.ht/~sashal/commit-classifier", default-features = false }
clap = "4.5"
git2 = "0.20"
env_logger = "0.11"
log = "0.4"
indicatif = "0.17"
shellexpand = "3.1"
regex = "1.8"
sha2 = "0.10"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tempfile = "3.8"

# Re-exported dependencies from commit-classifier
tokio = { version = "1.34", features = ["full"] }

[[bin]]
name = "autosel"
path = "src/main.rs"
