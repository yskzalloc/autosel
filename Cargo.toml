[package]
name = "autosel"
version = "0.1.0"
edition = "2024"
authors = ["Sasha Levin <sashal@kernel.org>"]
license = "GPL-2.0-only"
description = "CLI tool for automatically classifying whether Linux kernel commits should be backported to stable trees"
repository = "https://github.com/sashalevin/autosel"
readme = "README.md"
rust-version = "1.88"

[features]
default = []
cuda = ["commit-classifier/cuda"]

[dependencies]
commit-classifier = { git = "https://github.com/sashalevin/commit-classifier", branch = "main", default-features = false }
clap = "4.6"
env_logger = "0.11"
log = "0.4"
indicatif = "0.18"
shellexpand = "3.1"
regex = "1.12"
sha2 = "0.11"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tempfile = "3.27"

# Re-exported dependencies from commit-classifier
tokio = { version = "1.52", features = ["full"] }

[[bin]]
name = "autosel"
path = "src/main.rs"
