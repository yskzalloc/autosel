[package]
name = "autosel"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["candle_embed/cuda"]

[dependencies]
clap = "2.33"
git2 = "0.17"
log = "0.4"
env_logger = "0.10"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.8"
indicatif = "0.17"
sha2 = "0.10"
shellexpand = "3.1"
# For text processing
unicode-segmentation = "1.10"
# For embeddings
candle_embed = { git = "https://git.sr.ht/~sashal/candle_embed", default-features = false }
ndarray = "0.15"
anyhow = "1.0"
# For vector operations
bincode = "1.3"
# For compression
xz2 = "0.1"
# For async operations
tokio = { version = "1.34", features = ["full"] }
# For UUID generation and HNSW index
uuid = { version = "1.8", features = ["v4"] }
hnsw_rs = "0.2.0"
# For LLM API calls
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.8"
